name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vercel already builds every PR; this adds the check it does not run.
# No typecheck step: this repo has no tsconfig.json (plain JS + Vite).
# No test step: there are no test files yet.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
